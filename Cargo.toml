[package]
name = "ldk-lnurl-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "A small LNURL-pay frontend for ldk-server"
repository = "https://git.cashu.dev/thesimplekid/ldk-lnurl-server"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
hex = "0.4"
ldk-server-client = { git = "https://github.com/lightningdevkit/ldk-server", rev = "08316de8795a759eee08dc3873d32f980fbd0fe0" }
redb = { version = "4.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = true
